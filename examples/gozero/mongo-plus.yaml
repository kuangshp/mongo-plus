# generator.go 从此 YAML 读取生成配置；数据库连接段可选。
package: github.com/kuangshp/mongo-plus/examples/gozero
schemaDir: schema
pluralize: true # true 追加 s（users）；false 或省略不追加（user）。
model_pkg_path: internal/dal/entity
out_path: internal/dal/dao
repo_path: internal/dal/repository
dto_path: internal/dal/dto
vo_path: internal/dal/vo
id:
  type: int64 # 默认自增；无需再配置 generation。
softDelete: true
timestamps: true
# 可选：取消以下注释后，生成代码时先同步集合、校验器和索引。
# 省略整个 mongodb 段则只生成文件，集合由首次业务写入创建。
# mongodb:
#   uri: "mongodb://127.0.0.1:27017"
#   database: mongo_plus_gozero_demo
